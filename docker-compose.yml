services:
  web:
    build: .
    image: thermocouple-calibration:latest
    environment:
      PORT: 8080
    ports:
      # 宿主机端口可通过 HOST_PORT 环境变量配置，默认 8080
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  verify:
    image: thermocouple-calibration:latest
    build: .
    depends_on:
      web:
        condition: service_healthy
    environment:
      TARGET_URL: http://web:8080
    command: ["node", "verify/verify.js"]
    restart: "no"
